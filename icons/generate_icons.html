<!DOCTYPE html>
<html>
<head>
  <title>FastForm Icon Generator</title>
</head>
<body>
  <canvas id="c128" width="128" height="128"></canvas>
  <canvas id="c48" width="48" height="48"></canvas>
  <canvas id="c16" width="16" height="16"></canvas>
  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const s = canvas.width;
      const r = s * 0.18;

      // Rounded rectangle background with gradient
      const gradient = ctx.createLinearGradient(0, 0, s, s);
      gradient.addColorStop(0, '#6366F1');
      gradient.addColorStop(1, '#8B5CF6');

      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(s - r, 0);
      ctx.quadraticCurveTo(s, 0, s, r);
      ctx.lineTo(s, s - r);
      ctx.quadraticCurveTo(s, s, s - r, s);
      ctx.lineTo(r, s);
      ctx.quadraticCurveTo(0, s, 0, s - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // Form lines (white)
      ctx.strokeStyle = 'white';
      ctx.lineCap = 'round';
      ctx.lineWidth = s * 0.055;

      // Line 1 (long)
      ctx.beginPath();
      ctx.moveTo(s * 0.22, s * 0.3);
      ctx.lineTo(s * 0.78, s * 0.3);
      ctx.stroke();

      // Line 2 (medium)
      ctx.beginPath();
      ctx.moveTo(s * 0.22, s * 0.48);
      ctx.lineTo(s * 0.6, s * 0.48);
      ctx.stroke();

      // Line 3 (medium-long)
      ctx.beginPath();
      ctx.moveTo(s * 0.22, s * 0.66);
      ctx.lineTo(s * 0.68, s * 0.66);
      ctx.stroke();

      // Green checkmark circle
      const cx = s * 0.74;
      const cy = s * 0.74;
      const cr = s * 0.15;

      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.fillStyle = '#10B981';
      ctx.fill();

      // White border on circle
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = s * 0.025;
      ctx.stroke();

      // Checkmark
      ctx.beginPath();
      ctx.strokeStyle = 'white';
      ctx.lineWidth = s * 0.035;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.moveTo(cx - cr * 0.35, cy);
      ctx.lineTo(cx - cr * 0.05, cy + cr * 0.3);
      ctx.lineTo(cx + cr * 0.4, cy - cr * 0.3);
      ctx.stroke();
    }

    ['c128', 'c48', 'c16'].forEach(id => {
      drawIcon(document.getElementById(id));
    });

    // Download links
    ['c128', 'c48', 'c16'].forEach(id => {
      const canvas = document.getElementById(id);
      const link = document.createElement('a');
      link.download = `icon${canvas.width}.png`;
      link.href = canvas.toDataURL('image/png');
      link.textContent = `Download ${canvas.width}x${canvas.width}`;
      link.style.display = 'block';
      link.style.margin = '10px';
      document.body.appendChild(link);
    });
  </script>
</body>
</html>
